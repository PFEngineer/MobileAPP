name: analytics
description: >
  Client usability analytics — wraps Amplitude with a small, Google-style
  event API (screen_view, click, custom events). Standalone package with no
  dependency on the host app so it can be extracted into its own repository.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.11.0 <4.0.0"

# IMPORTANT: this package MUST NOT depend on `mobile_app` (or any app code).
# The dependency arrow is always app -> analytics, never the reverse, so the
# module stays extractable to an independent GitHub repository.
dependencies:
  flutter:
    sdk: flutter
  amplitude_flutter: ^4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
